<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <!-- Outer grid layout representing structure -->
  <rect x="10" y="10" width="80" height="80" rx="4" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.2"/>
  
  <!-- Left structural column (Steel) -->
  <rect x="25" y="20" width="8" height="60" rx="1" fill="#ffffff"/>
  
  <!-- Horizontal metal beams creating a structural 'B' & 'E' look -->
  <rect x="33" y="20" width="28" height="6" rx="1" fill="#ffffff"/>
  <rect x="33" y="47" width="24" height="6" rx="1" fill="#ffffff"/>
  <rect x="33" y="74" width="28" height="6" rx="1" fill="#ffffff"/>
  
  <!-- Arch representing Toughened Glass outline / curve -->
  <path d="M61 20 C75 20, 75 47, 57 47 C75 47, 75 74, 61 74" stroke="#8fb1b3" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
  
  <!-- Precision dot / welder spot -->
  <circle cx="29" cy="50" r="2.5" fill="#b39d82"/>
</svg>
